name: Recover Store

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      HEALTH_URL: ${{ secrets.HEALTH_URL }}
    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          printf 'Host target\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  BatchMode yes\n' "$SSH_HOST" "$SSH_USER" "$SSH_PORT" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Remove maintenance flag and inspect
        run: |
          ssh target "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          cd "$DEPLOY_PATH"
          echo "maintenance flag before:"; ls -l storage/framework/down 2>&1 || true
          rm -f storage/framework/down
          echo "maintenance flag after:"; ls -l storage/framework/down 2>&1 || echo "removed"
          echo "public/index.php present?"; ls -l public/index.php 2>&1 || true
          echo "folder contents:"; ls | head -30
          REMOTE

      - name: Test the site
        run: |
          echo "plain curl:"; curl -s -o /dev/null -w '%{http_code}\n' --max-time 20 "$HEALTH_URL"
          echo "browser-like curl:"; curl -s -o /dev/null -w '%{http_code}\n' --max-time 20 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120 Safari/537.36" "$HEALTH_URL"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
