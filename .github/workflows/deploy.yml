name: Deploy Store

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: test + SSH + backup + list changes, but deploy nothing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-store
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # 1) TEST: nothing is deployed unless this passes
  # ---------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, xml, curl, zip, gd, bcmath, intl
          tools: composer:v2

      - name: Validate composer files
        run: composer validate --no-check-publish

      - name: Create Laravel runtime folders (not stored in git)
        run: mkdir -p storage/logs storage/framework/{cache/data,sessions,views} storage/app/public bootstrap/cache

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP syntax check
        run: |
          if find app routes config database bootstrap -name '*.php' -print0 \
             | xargs -0 -n1 php -l 2>&1 | grep -v '^No syntax errors'; then
            echo "Syntax errors found"; exit 1
          fi

      - name: Application boots
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan route:list > /dev/null

      - name: Run test suite (enable with repo variable RUN_TESTS=true)
        if: vars.RUN_TESTS == 'true'
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

  # ---------------------------------------------------------------
  # 2) DEPLOY: backup -> maintenance -> upload -> migrate -> health check
  #    any failure after the backup restores files (and DB if touched)
  # ---------------------------------------------------------------
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      HEALTH_URL: ${{ secrets.HEALTH_URL }}
      KEEP_BACKUPS: '7'
      # PHP 8.3 is used only inside the deploy SSH sessions; the server default (7.4) is untouched
      PHP_DIR: /opt/cpanel/ea-php83/root/usr/bin
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, xml, curl, zip, gd, bcmath, intl
          tools: composer:v2

      - name: Create Laravel runtime folders (not stored in git)
        run: mkdir -p storage/logs storage/framework/{cache/data,sessions,views} storage/app/public bootstrap/cache

      - name: Build production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          {
            echo "Host target"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  BatchMode yes"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          echo "TS=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Server pre-flight checks
        run: |
          ssh target "DEPLOY_PATH='$DEPLOY_PATH' PHP_DIR='$PHP_DIR' bash -s" <<'REMOTE'
          set -e
          export PATH="$PHP_DIR:$PATH"
          cd "$DEPLOY_PATH"
          test -f artisan  || { echo "artisan not found in DEPLOY_PATH"; exit 1; }
          test -f .env     || { echo ".env missing on the server"; exit 1; }
          php -r 'exit(version_compare(PHP_VERSION, "8.0.0", ">=") ? 0 : 1);' || { echo "PHP is too old: $(php -v | head -1)"; exit 1; }
          echo "Using $(php -v | head -1)"
          command -v mysqldump >/dev/null || { echo "mysqldump not available"; exit 1; }
          command -v mysql >/dev/null     || { echo "mysql client not available"; exit 1; }
          echo "Free space:"; df -h "$DEPLOY_PATH" | tail -1
          REMOTE

      - name: Backup database and project folder (on the server)
        run: |
          ssh target "DEPLOY_PATH='$DEPLOY_PATH' TS='$TS' KEEP_BACKUPS='$KEEP_BACKUPS' bash -s" <<'REMOTE'
          set -e
          umask 077
          cd "$DEPLOY_PATH"
          B="$HOME/backups/store/$TS"
          mkdir -p "$B"

          envval() { grep -E "^$1=" .env | head -1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'\$//"; }
          DBH=$(envval DB_HOST); DBP=$(envval DB_PORT); DBN=$(envval DB_DATABASE)
          DBU=$(envval DB_USERNAME); DBW=$(envval DB_PASSWORD)

          echo "Dumping database $DBN ..."
          MYSQL_PWD="$DBW" mysqldump -h "${DBH:-localhost}" -P "${DBP:-3306}" -u "$DBU" \
            --single-transaction --routines --triggers --no-tablespaces "$DBN" | gzip > "$B/db.sql.gz"
          gzip -t "$B/db.sql.gz"
          test "$(stat -c %s "$B/db.sql.gz")" -gt 500 || { echo "DB dump looks empty"; exit 1; }

          echo "Archiving project folder ..."
          tar -czf "$B/files.tar.gz" \
            --exclude='./storage/logs' --exclude='./storage/framework/cache' \
            --exclude='./storage/framework/sessions' --exclude='./storage/framework/views' \
            -C "$DEPLOY_PATH" .
          tar -tzf "$B/files.tar.gz" > /dev/null

          echo "Backup OK: $B"; ls -lh "$B"

          # keep only the newest N backups
          cd "$HOME/backups/store" && ls -1dt */ | tail -n +$((${KEEP_BACKUPS:-7} + 1)) | xargs -r rm -rf
          REMOTE
          echo "BACKUP_DONE=true" >> "$GITHUB_ENV"

      - name: DRY RUN - show what would be uploaded (nothing is changed)
        if: inputs.dry_run == true
        run: |
          rsync -azn --itemize-changes \
            --exclude='.git' --exclude='.github' --exclude='.env' \
            --exclude='storage/' --exclude='node_modules/' --exclude='tests/' \
            --exclude='public/storage' --exclude='.user.ini' \
            -e "ssh -F $HOME/.ssh/config" \
            ./ "target:$DEPLOY_PATH/" | head -100
          echo "Dry run finished: backup was created and verified; no files, database or site mode were changed."

      - name: Enable maintenance mode
        if: inputs.dry_run != true
        run: |
          echo "FILES_TOUCHED=true" >> "$GITHUB_ENV"
          ssh target "export PATH='$PHP_DIR':\$PATH; cd '$DEPLOY_PATH' && php artisan down --retry=60 || true"

      - name: Upload files
        if: inputs.dry_run != true
        run: |
          rsync -rlptz --chmod=D755,F644 \
            --exclude='.git' --exclude='.github' --exclude='.env' \
            --exclude='storage/' --exclude='node_modules/' --exclude='tests/' \
            --exclude='public/storage' --exclude='.user.ini' \
            --exclude='.env.*' \
            --exclude='php.ini' \
            --exclude='error_log' \
            --exclude='*.log' \
            --exclude='.well-known/' \
            --exclude='cgi-bin/' \
            --exclude='bootstrap/cache/*.php' \
            --exclude='*.sql' \
            --exclude='public/uploads/' \
            -e "ssh -F $HOME/.ssh/config" \
            ./ "target:$DEPLOY_PATH/"
          ssh target "chmod 755 '$DEPLOY_PATH' '$DEPLOY_PATH/artisan'"

      - name: Migrate and clear caches
        if: inputs.dry_run != true
        run: |
          echo "DB_TOUCHED=true" >> "$GITHUB_ENV"
          ssh target "DEPLOY_PATH='$DEPLOY_PATH' PHP_DIR='$PHP_DIR' bash -s" <<'REMOTE'
          set -e
          export PATH="$PHP_DIR:$PATH"
          cd "$DEPLOY_PATH"
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan view:cache
          php artisan queue:restart || true
          REMOTE

      - name: Disable maintenance mode
        if: inputs.dry_run != true
        run: ssh target "export PATH='$PHP_DIR':\$PATH; cd '$DEPLOY_PATH' && php artisan up"

      - name: Health check
        if: inputs.dry_run != true
        run: |
          if [ -z "$HEALTH_URL" ]; then echo "HEALTH_URL secret not set - skipping HTTP check"; exit 0; fi
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$HEALTH_URL" || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then exit 0; fi
            sleep 10
          done
          echo "Health check failed"; exit 1

      # ---- automatic rollback --------------------------------------
      - name: ROLLBACK - restore files and database from backup
        if: failure() && env.BACKUP_DONE == 'true' && env.FILES_TOUCHED == 'true'
        run: |
          ssh target "DEPLOY_PATH='$DEPLOY_PATH' PHP_DIR='$PHP_DIR' TS='$TS' DB_TOUCHED='${DB_TOUCHED:-false}' bash -s" <<'REMOTE'
          set -e
          export PATH="$PHP_DIR:$PATH"
          B="$HOME/backups/store/$TS"
          cd "$DEPLOY_PATH"
          # no artisan here: the old code may not boot under PHP 8.3
          mkdir -p storage/framework && echo '{}' > storage/framework/down

          echo "Restoring files (exact copy of the backup; .env and storage kept) ..."
          T=$(mktemp -d); tar -xzf "$B/files.tar.gz" -C "$T"; chmod 755 "$T"
          rsync -a --delete --exclude='/.env' --exclude='/storage/' "$T"/ "$DEPLOY_PATH"/
          chmod 755 "$DEPLOY_PATH"
          rm -rf "$T"
          rm -f bootstrap/cache/*.php storage/framework/views/*.php

          if [ "$DB_TOUCHED" = "true" ]; then
            envval() { grep -E "^$1=" .env | head -1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'\$//"; }
            DBH=$(envval DB_HOST); DBP=$(envval DB_PORT); DBN=$(envval DB_DATABASE)
            DBU=$(envval DB_USERNAME); DBW=$(envval DB_PASSWORD)
            M() { MYSQL_PWD="$DBW" mysql -h "${DBH:-localhost}" -P "${DBP:-3306}" -u "$DBU" "$@"; }
            echo "Dropping all tables in $DBN, then importing the backup ..."
            { echo "SET FOREIGN_KEY_CHECKS=0;"
              M -N -e "SELECT CONCAT('DROP VIEW IF EXISTS \`',table_name,'\`;') FROM information_schema.views WHERE table_schema=DATABASE()" "$DBN"
              M -N -e "SELECT CONCAT('DROP TABLE IF EXISTS \`',table_name,'\`;') FROM information_schema.tables WHERE table_schema=DATABASE() AND table_type='BASE TABLE'" "$DBN"
            } | M "$DBN"
            gunzip -c "$B/db.sql.gz" | M "$DBN"
          else
            echo "Database was not touched - not restoring it."
          fi

          rm -f "$DEPLOY_PATH/storage/framework/down"
          echo "ROLLBACK COMPLETE - the previous version is live again."
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
